
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#875A7B"/>
      <stop offset="1" stop-color="#50364B"/>
    </linearGradient>

    <linearGradient id="building" x1="156" y1="132" x2="356" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEE7EC"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="512" height="512">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- University Building -->
  <g filter="url(#shadow)">
    <!-- Main Base -->
    <rect x="132" y="212" width="248" height="168" rx="28" fill="url(#building)"/>

    <!-- Roof -->
    <path d="M112 212L256 126L400 212" fill="#FFFFFF"/>

    <!-- Roof Layer -->
    <rect x="120" y="202" width="272" height="22" rx="11" fill="#D7C2D1"/>

    <!-- Columns -->
    <rect x="168" y="232" width="28" height="112" rx="14" fill="#875A7B" opacity="0.9"/>
    <rect x="228" y="232" width="28" height="112" rx="14" fill="#875A7B" opacity="0.9"/>
    <rect x="288" y="232" width="28" height="112" rx="14" fill="#875A7B" opacity="0.9"/>
    <rect x="348" y="232" width="28" height="112" rx="14" fill="#875A7B" opacity="0.9"/>

    <!-- Door -->
    <rect x="232" y="294" width="48" height="86" rx="18" fill="#5B3E55"/>
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(176 62)">
    <path d="M80 0L160 34L80 68L0 34L80 0Z" fill="#FFFFFF"/>
    <path d="M34 52V84C34 98 54 110 80 110C106 110 126 98 126 84V52"
          fill="#E8DCE4"/>

    <!-- Tassel -->
    <line x1="160" y1="34" x2="160" y2="82"
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="160" cy="90" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Decorative Bottom Line -->
  <rect x="160" y="410" width="192" height="12" rx="6" fill="#D7C2D1" opacity="0.7"/>
</svg>
