<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#875A7B"/>
      <stop offset="1" stop-color="#50364B"/>
    </linearGradient>

    <linearGradient id="paper" x1="156" y1="120" x2="356" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEE7EC"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="512" height="512">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- Exam Sheet -->
  <g filter="url(#shadow)">
    <rect x="136" y="116" width="240" height="280" rx="32" fill="url(#paper)"/>

    <!-- Folded Corner -->
    <path d="M316 116V176H376" fill="#E8DCE4"/>

    <!-- Lines -->
    <rect x="176" y="182" width="120" height="12" rx="6" fill="#D7C2D1"/>
    <rect x="176" y="222" width="140" height="12" rx="6" fill="#D7C2D1"/>
    <rect x="176" y="262" width="110" height="12" rx="6" fill="#D7C2D1"/>

    <!-- Checkboxes -->
    <rect x="144" y="176" width="20" height="20" rx="4" fill="#875A7B"/>
    <rect x="144" y="216" width="20" height="20" rx="4" fill="#875A7B"/>
    <rect x="144" y="256" width="20" height="20" rx="4" fill="#875A7B"/>
  </g>

  <!-- Large Checkmark -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="336" r="72" fill="#875A7B"/>
    <path
      d="M224 336L246 358L292 312"
      stroke="white"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(176 54)">
    <path d="M80 0L160 34L80 68L0 34L80 0Z" fill="#FFFFFF"/>
    <path d="M34 52V82C34 96 54 108 80 108C106 108 126 96 126 82V52"
          fill="#E8DCE4"/>

    <line x1="160" y1="34" x2="160" y2="82"
          stroke="#FFFFFF"
          stroke-width="6"
          stroke-linecap="round"/>
    <circle cx="160" cy="90" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Decorative Bottom Line -->
  <rect x="160" y="430" width="192" height="12" rx="6"
        fill="#D7C2D1" opacity="0.7"/>
</svg>